<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content">
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login / Register Screen -->
  <div id="auth-screen" class="auth-overlay">
    <div class="auth-box">
      <h2 id="auth-title">Login</h2>
      <p class="auth-subtitle">Unique Username & Password System</p>
      
      <div id="auth-error" class="error-msg"></div>
      
      <input type="text" id="username-input" placeholder="Enter unique @username" autocomplete="off">
      <input type="password" id="password-input" placeholder="Enter password">
      
      <button id="auth-submit-btn">Login</button>
      
      <p class="auth-switch">
        <span id="auth-switch-text">Need an account?</span>
        <a href="#" id="auth-toggle-link">Create Unique Username</a>
      </p>
    </div>
  </div>

  <!-- Main Messaging Application -->
  <div id="app-container" class="app-container hidden">
    
    <!-- Top Header with Triple Line (Hamburger) Button -->
    <header class="top-header">
      <button id="menu-toggle-btn" class="menu-btn" aria-label="Toggle Contacts">☰</button>
      <div class="header-info">
        <span id="active-contact-name">Select a Contact</span>
        <small id="logged-in-user"></small>
      </div>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </header>

    <div class="main-body">
      <!-- Backdrop for mobile menu -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Slide-out Contact Drawer -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h3>Contacts</h3>
        </div>
        
        <!-- Add New Contact Form -->
        <div class="add-contact-box">
          <input type="text" id="new-contact-input" placeholder="Add @username...">
          <button id="add-contact-btn">+</button>
        </div>

        <ul id="contact-list" class="contact-list">
          <!-- Contacts injected by JavaScript -->
        </ul>
      </aside>

      <!-- Chat Area -->
      <main class="chat-area">
        <div id="messages-list" class="messages-list">
          <!-- Messages injected by JavaScript -->
        </div>

        <!-- Mobile Keyboard-Safe Input Bar -->
        <form id="message-form" class="input-bar">
          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
          <button type="submit" id="send-btn">Send</button>
        </form>
      </main>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
